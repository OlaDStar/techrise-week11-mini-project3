name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --results=verified,unknown

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    needs: trufflehog

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit -r app \
          -lll \
          --exit-zero

  safety:
    name: Safety Dependency Scan
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Safety
        run: |
          pip install safety

      - name: Run Safety
        run: |
          safety scan \
          -r requirements.txt \
          --continue-on-error

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    needs: safety

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t mini-project3 .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mini-project3
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: trivy

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          soft_fail: true
